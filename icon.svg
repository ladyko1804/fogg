<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="55%" stop-color="#1b2a44"/>
      <stop offset="100%" stop-color="#0e3b45"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bcd7ff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- пунктирный маршрут -->
  <path d="M96 380 C 180 300, 250 420, 330 330 S 430 250, 424 176"
        fill="none" stroke="#39d3a5" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="2 34" opacity="0.95"/>

  <!-- буква F -->
  <g fill="url(#fg)">
    <rect x="170" y="150" width="52" height="212" rx="16"/>
    <rect x="170" y="150" width="150" height="52" rx="16"/>
    <rect x="170" y="232" width="118" height="50" rx="16"/>
  </g>

  <!-- точка финиша -->
  <circle cx="424" cy="176" r="26" fill="#39d3a5"/>
  <circle cx="424" cy="176" r="10" fill="#0f1216"/>
</svg>
