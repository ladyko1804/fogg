<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Мой день</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#0f1216;--card:#171c22;--line:#252c34;--text:#e9edf2;--dim:#93a1b0;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--accent:#4493f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{padding:12px 16px 10px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{margin:0;font-size:17px;font-weight:650}
.sub{color:var(--dim);font-size:13px;margin-top:3px}
.sub b{color:var(--text);font-weight:600}
section{padding:12px 16px;display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start}
.num{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#222a33;color:var(--dim);display:grid;place-items:center;font-size:13px;font-weight:600}
.num.cur{background:var(--accent);color:#fff}
.num.done{background:var(--ok);color:#04140a}
.t{font-weight:600}
.meta{color:var(--dim);font-size:13px;margin-top:3px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#222a33;color:#9db4cc;margin-left:6px}
.tag.km{background:#2a2333;color:#c9a7f5}
.tag.dk{background:#1d2b3d;color:#8fc0ff}
button{font:inherit;border:0;border-radius:11px;padding:10px 14px;background:#222a33;color:var(--text)}
button.primary{background:var(--accent);color:#fff;font-weight:600}
button.ok{background:var(--ok);color:#04140a;font-weight:600}
button.small{padding:7px 11px;font-size:14px}
button.wide{width:100%;margin-top:10px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border-radius:11px;border:1px solid var(--line);background:#12171d;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 12px;border-radius:10px;background:#12171d;border:1px solid var(--line);font-size:14px}
.chip.sel{background:#1d2b3d;border-color:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12161b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 0 11px;color:var(--dim);text-decoration:none;font-size:11.5px}
nav a.on{color:var(--accent)}
nav a b{display:block;font-size:17px;font-weight:400}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
ul.tasks{list-style:none;padding:0;margin:0}
ul.tasks li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
ul.tasks li:last-child{border-bottom:0}
ul.tasks li.checked .txt{text-decoration:line-through;color:var(--dim)}
.txt{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.cal .wd{text-align:center;font-size:11px;color:var(--dim);padding:2px 0}
.day{border-radius:11px;background:#12171d;border:1px solid var(--line);padding:6px 2px;text-align:center;min-height:58px;cursor:pointer}
.day.empty{background:transparent;border:0;cursor:default}
.day.today{border-color:#32506f}
.day.sel{background:#1d2b3d;border-color:var(--accent)}
.day .d{font-size:14px;font-weight:600}
.day .m{font-size:10.5px;color:var(--dim);line-height:1.3;margin-top:2px}
.day .m .r{color:#8fc0ff}
.day .m .s{color:var(--ok)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.calhead .mname{font-weight:600}
.calhead button{padding:6px 12px}
</style>
</head>
<body>
<header>
  <h1 id="h-title">Мой день</h1>
  <div class="sub" id="h-sub">—</div>
</header>

<section id="s-route" class="on"></section>

<section id="s-cal">
  <div class="card">
    <div class="calhead">
      <button id="cal-prev">‹</button>
      <div class="mname" id="cal-month">—</div>
      <button id="cal-next">›</button>
    </div>
    <div class="cal" id="cal-grid"></div>
    <div class="hint">Сверху — число визитов в маршруте, снизу синим — открытые точки, зелёным — отправленные отчёты. Нажми на день, чтобы открыть его маршрут.</div>
  </div>
</section>

<section id="s-report">
  <div class="card">
    <label>Магазин (только Магнит ДК и КМ)</label>
    <select id="r-point"></select>
    <label>Результат</label>
    <div class="chips" id="r-result"></div>
    <div id="r-km" style="display:none">
      <label>Подарочные наборы</label>
      <div class="chips" id="r-result2"></div>
    </div>
    <div id="r-shelves-wrap">
      <label>Полок на КСО</label>
      <input id="r-shelves" type="number" min="1" max="10" inputmode="numeric" placeholder="например 3">
    </div>
    <button class="primary wide" id="r-send">Отправить отчёт</button>
    <div class="hint" id="r-status"></div>
  </div>
  <div class="card">
    <div class="t">Кто отчитывается</div>
    <label>ФИО МЧ</label>
    <input id="p-name" autocomplete="name">
    <label>ФИО СВ</label>
    <input id="p-sv">
    <div class="hint">Хранится только в этом телефоне.</div>
  </div>
  <div class="card">
    <div class="t">Что уйдёт в форму</div>
    <div class="hint" id="r-preview">—</div>
  </div>
</section>

<section id="s-tasks">
  <div class="card">
    <div class="row" style="gap:8px">
      <input id="t-new" placeholder="Что надо не забыть">
      <button id="t-add">+</button>
    </div>
    <div class="hint">Задачи живут в этом телефоне.</div>
  </div>
  <div class="card"><ul class="tasks" id="t-list"></ul></div>
</section>

<nav>
  <a href="#" data-tab="route" class="on"><b>◉</b>Маршрут</a>
  <a href="#" data-tab="cal"><b>▦</b>Календарь</a>
  <a href="#" data-tab="report"><b>▤</b>Отчёт</a>
  <a href="#" data-tab="tasks"><b>✓</b>Задачи</a>
</nav>

<script>
const FORM_ID="1FAIpQLSfEcy6NYnVmjE1NCJzuAxqoP9SCWRHzPtIML1IfZlvGyBCu9Q";
const E={name:"entry.1887951302",sv:"entry.1672473792",tim:"entry.1640848219",date:"entry.1670782349",
         tt:"entry.2136880205",project:"entry.926667286",result:"entry.1945792798",shelves:"entry.539189160"};
const RESULTS=["Выполнено","Не выполнено НТЗ","Не выполнено ЗАПРЕТ ДМ","Не выполнено Другое"];

/* ---------- даты ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=iso(new Date());
const MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function humanDate(s){
  const [y,m,d]=s.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  const wd=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][dt.getDay()];
  return `${d} ${MONTHS_GEN[m-1]} · ${wd}`;
}

/* ---------- данные ---------- */
const SEED=[
 {net:"Магнит ДК",lvl:"Медь",addr:"Муринский, 51",tt:"107070",proj:"Gillette OSA",hours:"08:30–22:30",tim:"КСО"},
 {net:"Магнит ДК",lvl:"Золото",addr:"Гражданский, 75к7",tt:"107072",proj:"Gillette OSA",hours:"08:00–23:00",tim:"КСО"},
 {net:"Магнит ДК",lvl:"Золото",addr:"Политехническая, 17к1",tt:"107064",proj:"Gillette OSA",hours:"08:00–23:00",tim:"КСО",note:"закрытая парковка"},
 {net:"Перекрёсток",lvl:"—",addr:"Культуры, 1",tt:"107044",proj:"Gillette OSA",hours:"08:00–23:00",tim:"—"},
 {net:"Перекрёсток",lvl:"—",addr:"Культуры, 1",tt:"107044",proj:"Oral Care OSA",hours:"08:00–23:00",tim:"—"},
 {net:"Перекрёсток",lvl:"—",addr:"Науки, 23",tt:"107046",proj:"Gillette OSA",hours:"круглосуточно",tim:"—"},
 {net:"Перекрёсток",lvl:"—",addr:"Науки, 23",tt:"107046",proj:"Oral Care OSA",hours:"круглосуточно",tim:"—"},
 {net:"Магнит КМ",lvl:"Серебро",addr:"Науки, 15к1",tt:"106974",proj:"Gillette",hours:"10:00–22:00",tim:"КМ1"},
 {net:"Магнит ДК",lvl:"Железо",addr:"Науки, 17к5",tt:"166733",proj:"Gillette OSA",hours:"08:39–22:30",tim:"КСО"},
 {net:"Магнит ДК",lvl:"Железо",addr:"Обручевых, 5 (уточнить)",tt:"163836",proj:"Gillette OSA",hours:"—",tim:"КСО"},
 {net:"Магнит ДК",lvl:"Железо",addr:"Науки, 19к2литА",tt:"177198",proj:"Gillette OSA",hours:"08:00–22:30",tim:"КСО"},
 {net:"Пятёрочка",lvl:"Медь",addr:"Пархоменко, 7",tt:"142653",proj:"Gillette",hours:"—",tim:"—"},
 {net:"Пятёрочка",lvl:"Серебро",addr:"Карпинского, 38к1",tt:"141417",proj:"Gillette",hours:"07:30–23:00",tim:"—"},
 {net:"Пятёрочка",lvl:"Медь",addr:"Карпинского, 16",tt:"155954",proj:"Gillette",hours:"07:30–23:00",tim:"—"}
];
function kindOf(net){ if(/КМ/.test(net))return "km"; if(/ДК/.test(net))return "dk"; return "none" }

let state=load();
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem("moi-day2")||"null")}catch(e){}
  if(!s)s={days:{},tasks:[],active:todayISO,calY:new Date().getFullYear(),calM:new Date().getMonth()};
  if(!s.days[todayISO])s.days[todayISO]=SEED.map(p=>({...p,kind:kindOf(p.net),done:false}));
  if(!s.active)s.active=todayISO;
  return s;
}
function save(){localStorage.setItem("moi-day2",JSON.stringify(state))}
function sentLog(){try{return JSON.parse(localStorage.getItem("moi-sent")||"[]")}catch(e){return []}}
function sentFor(date){return sentLog().filter(x=>x.date===date).length}
function pts(date){return state.days[date]||[]}
function prof(){try{return JSON.parse(localStorage.getItem("moi-prof")||"{}")}catch(e){return {}}}

/* ---------- навигация ---------- */
document.querySelectorAll("nav a").forEach(a=>a.onclick=e=>{
  e.preventDefault();
  document.querySelectorAll("nav a").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  a.classList.add("on");document.getElementById("s-"+a.dataset.tab).classList.add("on");
  if(a.dataset.tab==="report")fillReport();
  if(a.dataset.tab==="cal")renderCal();
});

/* ---------- маршрут ---------- */
function renderRoute(){
  const list=pts(state.active), done=list.filter(p=>p.done).length;
  document.getElementById("h-title").textContent=state.active===todayISO?"Сегодня":"Маршрут";
  document.getElementById("h-sub").innerHTML=`${humanDate(state.active)} · <b>${done} из ${list.length}</b> точек · отчётов: <b>${sentFor(state.active)}</b>`;
  const wrap=document.getElementById("s-route");
  if(!list.length){wrap.innerHTML='<div class="card"><div class="hint">На этот день маршрута нет. Пришли мне выгрузку — добавлю точки.</div></div>';return}
  wrap.innerHTML="";
  const curIdx=list.findIndex(x=>!x.done);
  list.forEach((p,idx)=>{
    const el=document.createElement("div");el.className="card";
    const kindTag=p.kind==="dk"?'<span class="tag dk">КСО</span>':p.kind==="km"?'<span class="tag km">'+(p.tim||"КМ")+'</span>':'';
    el.innerHTML=`<div class="row">
      <div class="num ${p.done?"done":(!p.done&&idx===curIdx)?"cur":""}">${p.done?"✓":idx+1}</div>
      <div style="flex:1">
        <div class="t">${p.net}${p.lvl&&p.lvl!=="—"?' · '+p.lvl:''}${kindTag}</div>
        <div class="meta">${p.addr} · код ${p.tt}</div>
        <div class="meta">${p.proj||"—"}${p.hours&&p.hours!=="—"?" · "+p.hours:""}${p.note?" · "+p.note:""}</div>
        <div class="row" style="gap:8px;margin-top:10px">
          ${p.done?`<button class="small" data-undone="${idx}">вернуть</button>`:`<button class="ok small" data-done="${idx}">Готова</button>`}
          ${p.kind!=="none"?`<button class="small" data-rep="${idx}">Отчёт</button>`:""}
        </div>
      </div></div>`;
    wrap.appendChild(el);
  });
  wrap.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{pts(state.active)[+b.dataset.done].done=true;save();renderRoute()});
  wrap.querySelectorAll("[data-undone]").forEach(b=>b.onclick=()=>{pts(state.active)[+b.dataset.undone].done=false;save();renderRoute()});
  wrap.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{state.repIdx=+b.dataset.rep;save();go("report")});
}
function go(t){document.querySelector(`nav a[data-tab="${t}"]`).click()}

/* ---------- календарь ---------- */
function renderCal(){
  const y=state.calY,m=state.calM;
  document.getElementById("cal-month").textContent=`${MONTHS[m]}, ${y}`;
  const grid=document.getElementById("cal-grid");grid.innerHTML="";
  ["пн","вт","ср","чт","пт","сб","вс"].forEach(w=>{
    const d=document.createElement("div");d.className="wd";d.textContent=w;grid.appendChild(d);
  });
  const first=new Date(y,m,1);
  let lead=(first.getDay()+6)%7;
  for(let i=0;i<lead;i++){const e=document.createElement("div");e.className="day empty";grid.appendChild(e)}
  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`;
    const list=pts(ds), done=list.filter(p=>p.done).length, sent=sentFor(ds);
    const el=document.createElement("div");
    el.className="day"+(ds===todayISO?" today":"")+(ds===state.active?" sel":"");
    el.innerHTML=`<div class="d">${d}</div><div class="m">${list.length?`<span class="r">${done}/${list.length}</span>`:""}${sent?`<br><span class="s">✓${sent}</span>`:""}</div>`;
    el.onclick=()=>{state.active=ds;save();renderRoute();go("route")};
    grid.appendChild(el);
  }
}
document.getElementById("cal-prev").onclick=()=>{state.calM--;if(state.calM<0){state.calM=11;state.calY--}save();renderCal()};
document.getElementById("cal-next").onclick=()=>{state.calM++;if(state.calM>11){state.calM=0;state.calY++}save();renderCal()};

/* ---------- отчёт ---------- */
let selResult=null,selResult2=null;
function reportable(){return pts(state.active).map((p,i)=>({p,i})).filter(o=>o.p.kind!=="none")}
function fillReport(){
  const sel=document.getElementById("r-point"), list=reportable();
  if(!list.length){sel.innerHTML='<option value="">нет магазинов ДК/КМ на этот день</option>';syncReport();return}
  sel.innerHTML=list.map(o=>`<option value="${o.i}">${o.p.net} — ${o.p.addr} · ${o.p.tt}</option>`).join("");
  if(typeof state.repIdx==="number")sel.value=String(state.repIdx);
  sel.onchange=()=>{state.repIdx=+sel.value;syncReport()};
  syncReport();
}
function buildChips(){
  const mk=(host,get)=>{
    host.innerHTML="";
    RESULTS.forEach(r=>{
      const c=document.createElement("div");
      c.className="chip"+(get()===r?" sel":"");
      c.textContent=r.replace("Не выполнено ","нет: ");
      c.onclick=()=>{get(r);buildChips();syncReport()};
      host.appendChild(c);
    });
  };
  mk(document.getElementById("r-result"),r=>{if(r)selResult=r;return selResult});
  mk(document.getElementById("r-result2"),r=>{if(r)selResult2=r;return selResult2});
}
function curPoint(){const v=document.getElementById("r-point").value;return v===""?null:pts(state.active)[+v]}
function syncReport(){
  const p=curPoint();
  const pv=document.getElementById("r-preview");
  if(!p){document.getElementById("r-km").style.display="none";document.getElementById("r-shelves-wrap").style.display="none";pv.textContent="—";return}
  document.getElementById("r-km").style.display=p.kind==="km"?"block":"none";
  document.getElementById("r-shelves-wrap").style.display=p.kind==="dk"?"block":"none";
  const tim=p.kind==="dk"?"Магнит ММ  Выкладка на КСО":"МК Платина-Золото-Серебро / МК Подарочные наборы";
  const pr=p.kind==="dk"?"Gillette OSA":"Gillette";
  pv.innerHTML=`Дата: <b>${state.active}</b><br>Код ТТ: <b>${p.tt}</b><br>Проект: <b>${pr}</b><br>ТИМ: <b>${tim}</b><br>Результат: <b>${selResult||"—"}</b>`+
    (p.kind==="km"?`<br>Подарочные: <b>${selResult2||"—"}</b>`:"")+
    (p.kind==="dk"?`<br>Полок: <b>${document.getElementById("r-shelves").value||"—"}</b>`:"");
}
document.getElementById("r-shelves").oninput=syncReport;
function saveProf(){
  localStorage.setItem("moi-prof",JSON.stringify({
    name:document.getElementById("p-name").value.trim(),
    sv:document.getElementById("p-sv").value.trim()}));
}
(function initProf(){const p=prof();const n=document.getElementById("p-name"),s=document.getElementById("p-sv");
  n.value=p.name||"";s.value=p.sv||"";n.oninput=saveProf;s.oninput=saveProf;buildChips()})();

async function postForm(data){
  return fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`,{
    method:"POST",mode:"no-cors",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(data).toString()
  });
}
document.getElementById("r-send").onclick=async()=>{
  const p=curPoint(),st=document.getElementById("r-status");
  if(!p){st.innerHTML='<span class="warn">Нет магазина ДК/КМ на этот день</span>';return}
  if(!selResult){st.innerHTML='<span class="warn">Выбери результат</span>';return}
  const pf=prof();
  if(!pf.name||!pf.sv){st.innerHTML='<span class="warn">Заполни ФИО МЧ и ФИО СВ ниже</span>';return}
  const base={[E.name]:pf.name,[E.sv]:pf.sv,[E.tt]:p.tt,[E.date]:state.active};
  const jobs=[];
  if(p.kind==="dk"){
    const sh=document.getElementById("r-shelves").value;
    const d={...base,[E.tim]:"Магнит ММ  Выкладка на КСО",[E.project]:"Gillette OSA",[E.result]:selResult};
    if(sh&&selResult==="Выполнено")d[E.shelves]=sh;
    jobs.push(d);
  }else{
    jobs.push({...base,[E.tim]:"МК Платина-Золото-Серебро",[E.project]:"Gillette",[E.result]:selResult});
    jobs.push({...base,[E.tim]:"МК Подарочные наборы",[E.project]:"Gillette",[E.result]:selResult2||selResult});
  }
  st.textContent="Отправляю…";
  try{
    for(const d of jobs)await postForm(d);
    const log=sentLog();
    log.push({at:new Date().toISOString(),date:state.active,tt:p.tt,addr:p.addr,
              tims:jobs.map(j=>j[E.tim]),results:jobs.map(j=>j[E.result])});
    localStorage.setItem("moi-sent",JSON.stringify(log));
    st.innerHTML=`<span class="ok">Отправлено: ${jobs.length===1?"1 отчёт":"2 отчёта"}. Всего за ${state.active}: ${sentFor(state.active)}</span>`;
    renderRoute();
  }catch(e){
    st.innerHTML=`<span class="bad">Не ушло: ${e.message}. Проверь интернет и попробуй ещё раз</span>`;
  }
};

/* ---------- задачи ---------- */
function renderTasks(){
  const ul=document.getElementById("t-list");
  ul.innerHTML=state.tasks.map((t,i)=>`<li class="${t.done?"checked":""}">
    <button class="small" data-t="${i}">${t.done?"✓":"○"}</button>
    <span class="txt">${t.text}</span>
    <button class="small" data-del="${i}">✕</button></li>`).join("")||'<li class="hint">Пока пусто</li>';
  ul.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=state.tasks[+b.dataset.t];t.done=!t.done;save();renderTasks()});
  ul.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.tasks.splice(+b.dataset.del,1);save();renderTasks()});
}
document.getElementById("t-add").onclick=()=>{
  const v=document.getElementById("t-new").value.trim();if(!v)return;
  state.tasks.push({text:v,done:false});document.getElementById("t-new").value="";save();renderTasks();
};

renderRoute();renderTasks();renderCal();fillReport();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
